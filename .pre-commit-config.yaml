repos:
  - repo: local
    hooks:
      - id: validate-skills
        name: validate skills
        entry: uv run python scripts/validate.py
        language: system
        pass_filenames: false
        files: ^(skills/|scripts/)
      - id: build-check
        name: generated files up to date
        entry: uv run python scripts/build.py --check
        language: system
        pass_filenames: false
        files: ^(skills/|scripts/|hub\.json$|plugins/|\.claude-plugin/|manifest\.json$)
